<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obstetrica · 老師後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="../exam-bank.js"></script>
<style>
:root {
  --ink: #1a1d1f;
  --ink-soft: #4a5258;
  --ink-mute: #8b939a;
  --paper: #faf8f3;
  --card: #ffffff;
  --line: #e6e0d4;
  --gold: #b08d4f;
  --rust: #a3522e;
  --teal: #2e6e7a;
  --green: #4a7c59;
  --red: #c0463a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Serif TC', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
}
header {
  background: var(--ink);
  color: var(--paper);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.brand { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 20px; }
.brand-sub { font-size: 13px; opacity: 0.7; margin-left: 8px; font-weight: 400; }
.user-area { font-size: 14px; display: flex; gap: 12px; align-items: center; }
.user-area a, .user-area button {
  color: var(--paper); background: none; border: 1px solid rgba(250,248,243,0.3);
  padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
  text-decoration: none;
}
.user-area button:hover, .user-area a:hover { background: rgba(250,248,243,0.1); }
main { max-width: 1280px; margin: 0 auto; padding: 24px; }
.controls {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: end;
  background: var(--card); padding: 16px; border-radius: 8px;
  border: 1px solid var(--line); margin-bottom: 20px;
}
.ctrl-group { display: flex; flex-direction: column; gap: 4px; }
.ctrl-group label { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.ctrl-group select, .ctrl-group input {
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px;
  font: inherit; background: white; min-width: 180px;
}
.btn {
  padding: 8px 16px; background: var(--ink); color: var(--paper);
  border: none; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 500;
}
.btn:hover { background: #2a2d2f; }
.btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn-link {
  background: none; border: none; padding: 4px 8px; color: var(--gold);
  cursor: pointer; font: inherit; font-size: 13px; text-decoration: underline;
}
.btn-link:hover { color: var(--ink); }
/* session detail modal (Tab 2) */
.modal-box-lg { max-width: 880px; width: 92%; max-height: 88vh; overflow-y: auto; padding: 24px 28px; }
.session-detail-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px;
}
.session-detail-header h2 { font-family: 'Noto Serif TC', serif; margin: 0; }
.session-detail-close {
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: var(--ink-soft); padding: 0; width: auto; line-height: 1;
}
.session-detail-close:hover { color: var(--rust); }
.session-detail-summary {
  display: flex; gap: 24px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--paper); border-radius: 4px; margin-bottom: 16px;
}
.session-detail-summary > div { display: flex; flex-direction: column; gap: 2px; }
.session-detail-summary-label {
  color: var(--ink-mute); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
}
.session-detail-summary-value { font-weight: 600; font-size: 15px; color: var(--ink); }
.attempt-card {
  padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 4px; margin-bottom: 8px;
}
.attempt-card.wrong { border-color: var(--rust); background: #fdf5f2; }
.attempt-card.correct { opacity: 0.55; }
.attempt-meta {
  display: flex; gap: 10px; font-size: 12px;
  color: var(--ink-mute); margin-bottom: 6px; align-items: center;
}
.attempt-qid { font-family: monospace; color: var(--gold); font-size: 12px; }
.attempt-tag {
  padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500;
}
.attempt-tag.wrong { background: var(--rust); color: white; }
.attempt-tag.correct { background: #4a7c59; color: white; }
.attempt-question {
  font-size: 14px; line-height: 1.65; margin-bottom: 10px;
  color: var(--ink); white-space: pre-wrap;
}
.attempt-missing-bank {
  font-style: italic; color: var(--ink-mute); font-size: 13px; margin-bottom: 8px;
}
.attempt-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.attempt-answer-block { padding: 8px 12px; border-radius: 3px; background: var(--paper); }
.attempt-answer-block.user-wrong { background: #fbe9e1; }
.attempt-answer-block.correct-ans { background: #e9f1ea; }
.attempt-answer-label {
  font-size: 11px; color: var(--ink-mute);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px;
}
.attempt-answer-text { font-weight: 500; font-size: 13px; line-height: 1.5; }
@media (max-width: 600px) {
  .attempt-answers { grid-template-columns: 1fr; }
}
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px;
}
.kpi-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-size: 32px; font-weight: 600; margin-top: 4px; font-family: 'Noto Serif TC', serif; }
.kpi-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-2 > * { min-width: 0; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 20px; margin-bottom: 20px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; font-family: 'Noto Serif TC', serif; }
.card-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
.chart-wrap { position: relative; }
.chart-wrap canvas { max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--ink-soft); font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; background: #fafafa; }
tbody tr:hover { background: #fafafa; }
.tag-pre { color: var(--teal); font-size: 12px; font-weight: 500; }
.tag-post { color: var(--gold); font-size: 12px; font-weight: 500; }
.tag-practice { color: var(--ink-mute); font-size: 12px; font-weight: 500; }
.tag-correct { color: var(--green); font-weight: 600; }
.tag-wrong { color: var(--red); font-weight: 600; }
.empty {
  text-align: center; padding: 40px; color: var(--ink-mute);
  font-style: italic;
}
/* modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-bg.active { display: flex; }
.modal-box {
  background: var(--card); border-radius: 8px; padding: 28px; width: 90%; max-width: 420px;
}
.modal-box h2 { font-family: 'Noto Serif TC', serif; margin-bottom: 8px; }
.modal-box p { color: var(--ink-soft); font-size: 14px; margin-bottom: 16px; }
.modal-box input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 4px; font: inherit; margin-bottom: 12px;
}
.modal-box button { width: 100%; padding: 12px; background: var(--ink); color: var(--paper); border: none; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 500; }
.status-msg { font-size: 13px; color: var(--ink-soft); margin-top: 12px; line-height: 1.5; }
.deny-card { text-align: center; padding: 60px 20px; }
.deny-card h2 { font-family: 'Noto Serif TC', serif; margin-bottom: 12px; }
.deny-card p { color: var(--ink-soft); margin-bottom: 16px; }

/* ===== Tabs (v1.7) ===== */
.tab-bar {
  display: flex; gap: 4px; margin-bottom: 20px;
  border-bottom: 2px solid var(--line);
  overflow-x: auto;
  scrollbar-width: thin;
}
.tab-btn {
  padding: 12px 18px; background: none; border: none;
  font: inherit; font-size: 14px; cursor: pointer;
  color: var(--ink-soft); white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  display: inline-flex; align-items: baseline; gap: 6px;
}
.tab-btn:hover { color: var(--ink); background: rgba(0,0,0,0.02); }
.tab-btn.active {
  color: var(--ink); border-bottom-color: var(--gold); font-weight: 600;
}
.tab-btn .en { font-size: 11px; color: var(--ink-mute); font-weight: 400; }
.tab-btn.active .en { color: var(--gold); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== Accuracy bar ===== */
.acc-cell { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.acc-bar-wrap { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
.acc-bar-fill { height: 100%; transition: width 0.3s; }
.acc-bar-fill.low  { background: var(--red); }
.acc-bar-fill.mid  { background: var(--gold); }
.acc-bar-fill.high { background: var(--green); }
.acc-text { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 48px; text-align: right; color: var(--ink); }

/* ===== Sortable table ===== */
table.sortable th { cursor: pointer; user-select: none; }
table.sortable th:hover { background: #f0ede5; }
table.sortable th.sorted-asc::after  { content: ' ↑'; color: var(--gold); }
table.sortable th.sorted-desc::after { content: ' ↓'; color: var(--gold); }
table.clickable-rows tbody tr { cursor: pointer; }
table.clickable-rows tbody tr:hover { background: #f5f0e2; }
/* v1.8 Step 6: row-selected for Tab 6 rotation list */
table.clickable-rows tbody tr.row-selected,
table.clickable-rows tbody tr.row-selected:hover { background: #fce8a3; }
/* v1.8 Step 6: delta 進步幅度色彩（給文字 cell 用） */
td.acc-high { color: var(--green); }
td.acc-mid  { color: var(--ink); }
td.acc-low  { color: var(--red); }

/* ===== Tab placeholder (for tabs not yet implemented) ===== */
.tab-stub { padding: 80px 20px; text-align: center; color: var(--ink-mute); font-style: italic; font-size: 15px; }

/* ===== Tab 2: Student profile card ===== */
.profile-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
}
.profile-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--rust));
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 600; font-family: 'Noto Serif TC', serif;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.profile-info { min-width: 0; }
.profile-name { font-size: 22px; font-weight: 600; font-family: 'Noto Serif TC', serif; }
.profile-meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; word-break: break-all; }
.profile-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.profile-stat { text-align: right; min-width: 64px; }
.profile-stat-label { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.5px; }
.profile-stat-value { font-size: 22px; font-weight: 600; font-family: 'Noto Serif TC', serif; margin-top: 2px; font-variant-numeric: tabular-nums; }
.profile-stat-value.small { font-size: 14px; }
@media (max-width: 760px) {
  .profile-card { grid-template-columns: auto 1fr; }
  .profile-stats { grid-column: 1 / -1; justify-content: flex-start; gap: 18px; }
  .profile-stat { text-align: left; }
}

/* ===== Tab 3: Wrong list ===== */
.diff-arrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  letter-spacing: 0.5px;
  min-width: 28px;
  text-align: center;
}
.diff-wrong {
  color: var(--red);
  background: rgba(192, 70, 58, 0.10);
  border: 1px solid rgba(192, 70, 58, 0.25);
}
.diff-correct {
  color: var(--green);
  background: rgba(74, 124, 89, 0.10);
  border: 1px solid rgba(74, 124, 89, 0.25);
}
.stats-line {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; margin-bottom: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px; color: var(--ink-soft);
  flex-wrap: wrap; gap: 12px;
}
.stats-line b { color: var(--ink); font-weight: 600; }
.empty-celebrate {
  text-align: center; padding: 80px 20px; color: var(--ink-soft);
  font-size: 18px; font-family: 'Noto Serif TC', serif;
}
td code {
  font-family: 'Inter', monospace;
  font-size: 12px;
  background: #f5f0e2;
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--ink);
}

/* ===== Tab 4: Weakness analysis ===== */
.toggle-group {
  display: inline-flex; border: 1px solid var(--line); border-radius: 6px;
  overflow: hidden; background: var(--card);
}
.toggle-btn {
  padding: 8px 16px; background: var(--card); border: none;
  border-right: 1px solid var(--line);
  font: inherit; cursor: pointer; color: var(--ink-soft); white-space: nowrap;
}
.toggle-btn:last-child { border-right: none; }
.toggle-btn:hover { background: #f5f0e2; }
.toggle-btn.active { background: var(--ink); color: var(--paper); font-weight: 500; }
.chip-group { display: inline-flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
.chip {
  padding: 6px 14px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; font: inherit; font-size: 13px; cursor: pointer;
  color: var(--ink-soft); user-select: none;
}
.chip:hover { background: #f5f0e2; }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 500; }
.weakness-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.weak-chip {
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 6px 12px; border-radius: 14px; font-size: 13px;
  font-variant-numeric: tabular-nums; border: 1px solid;
}
.weak-chip.low  { color: var(--red);   background: rgba(192,70,58,0.08); border-color: rgba(192,70,58,0.3); }
.weak-chip.mid  { color: var(--gold);  background: rgba(176,141,79,0.08); border-color: rgba(176,141,79,0.3); }
.weak-chip.high { color: var(--green); background: rgba(74,124,89,0.08); border-color: rgba(74,124,89,0.3); }
.weak-chip-name   { font-weight: 500; }
.weak-chip-acc    { font-weight: 700; }
.weak-chip-counts { color: var(--ink-mute); font-size: 11px; }

/* ===== Tab 5: Misconception analysis ===== */
.mc-intro {
  background: rgba(176, 141, 79, 0.06);
  border: 1px solid rgba(176, 141, 79, 0.35);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.65;
}
.mc-intro b { color: var(--ink); }
.misconception-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-top: 12px;
}
@media (max-width: 980px) {
  .misconception-grid { grid-template-columns: 1fr; }
}
.mc-card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.mc-warning-badge {
  position: absolute;
  top: -10px;
  right: 14px;
  background: var(--red);
  color: var(--paper);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 8px rgba(192, 70, 58, 0.35);
  z-index: 1;
}
.mc-card-header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px;
}
.mc-qid {
  font-family: 'Inter', monospace;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  padding: 3px 10px;
  background: #f5f0e2;
  border-radius: 4px;
  border: 1px dashed transparent;
  transition: border-color 0.15s, background 0.15s;
  user-select: all;
}
.mc-qid:hover { border-color: var(--gold); background: #ede4c8; }
.mc-tags {
  display: flex; gap: 8px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-soft);
  align-items: baseline;
}
.mc-tag-cat { color: var(--teal); font-weight: 500; }
.mc-acc-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 0;
  border-top: 1px dashed var(--line);
  border-bottom: 1px dashed var(--line);
}
.mc-acc-block { flex-shrink: 0; }
.mc-acc-label {
  font-size: 11px; color: var(--ink-mute);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.mc-acc-value {
  font-size: 28px; font-weight: 600;
  font-family: 'Noto Serif TC', serif;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.mc-acc-value.low  { color: var(--red); }
.mc-acc-value.mid  { color: var(--gold); }
.mc-acc-value.high { color: var(--green); }
.mc-acc-meta {
  font-size: 12px; color: var(--ink-soft);
  line-height: 1.6; flex: 1; min-width: 0;
}
.mc-acc-meta b { color: var(--ink); }
.mc-no-distractor { color: var(--ink-mute); font-style: italic; }
.mc-chart-wrap { position: relative; height: 180px; }

/* Range slider polish */
input[type=range] { accent-color: var(--gold); }

/* Toast */
.toast {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--paper);
  padding: 10px 20px; border-radius: 6px;
  font-size: 14px; z-index: 1000;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div>
    <span class="brand">Obstetrica</span>
    <span class="brand-sub">老師後台 · TSGH OB/GYN Residency</span>
  </div>
  <div class="user-area" id="userArea"></div>
</header>

<main id="mainContent">
  <div class="empty" id="loadingMsg">載入中…</div>
</main>

<!-- Login modal -->
<div class="modal-bg" id="loginModal">
  <div class="modal-box">
    <h2>老師登入</h2>
    <p>輸入老師 email，我們會寄一封 Magic Link 給你。</p>
    <input type="email" id="loginEmail" placeholder="老師 email" autocomplete="email"/>
    <button onclick="doLogin()">寄送登入連結</button>
    <div class="status-msg" id="loginStatus"></div>
  </div>
</div>

<!-- Session detail modal (Tab 2: 點 session row 後彈出該場全部答題明細) -->
<div class="modal-bg" id="sessionDetailModal" onclick="if(event.target===this) closeSessionDetailModal()">
  <div class="modal-box modal-box-lg">
    <div class="session-detail-header">
      <h2>答題明細 <span style="color:var(--ink-mute); font-size:14px; font-weight:400;">Session Detail</span></h2>
      <button class="session-detail-close" onclick="closeSessionDetailModal()" title="關閉 (Esc)">✕</button>
    </div>
    <div id="sessionDetailBody"></div>
  </div>
</div>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://faeqleeuisevhuqveilx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aCZ6yh9Mi_jX0l4E8gHSqQ_wAMHYfaj';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
const REDIRECT_TO = window.location.origin + window.location.pathname;

// ===== 8-axis category grouping (legacy: kept for Tab 4/5 future use) =====
const CATEGORY_GROUPS = {

// ===== UTILITIES =====
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}
function relativeTime(iso) {
  if (!iso) return '—';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '—';
  const diff = Date.now() - t;
  if (diff < 0) return '剛剛';
  if (diff < 60_000) return '剛剛';
  if (diff < 3_600_000) return Math.floor(diff / 60_000) + ' 分鐘前';
  if (diff < 86_400_000) return Math.floor(diff / 3_600_000) + ' 小時前';
  if (diff < 30 * 86_400_000) return Math.floor(diff / 86_400_000) + ' 天前';
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Normalize accuracy to a 0–100 number (handles both 0–1 ratio and 0–100 percent forms)
function toPct(v) {
  if (v == null) return 0;
  const n = Number(v);
  if (isNaN(n)) return 0;
  return n > 1 ? +n.toFixed(1) : +(n * 100).toFixed(1);
}
function accClass(pct) {
  return pct >= 70 ? 'high' : pct >= 50 ? 'mid' : 'low';
}
// 從 'XX-YY' 取大科別（用於 Tab 3 attempts.category 篩選）
// 婦科-* → 婦科；產科-* → 產科；其他（含 婦癌-*）→ 其他
function categoryMajor(cat) {
  if (!cat) return '其他';
  const prefix = String(cat).split('-')[0];
  if (prefix === '婦科' || prefix === '產科') return prefix;
  return '其他';
}
// 匯出 CSV（UTF-8 with BOM，Excel 讀中文不亂碼）
function exportCsv(rows, filename) {
  if (!rows || rows.length === 0) return;
  const cols = Object.keys(rows[0]);
  const escapeCell = v => {
    if (v == null) return '';
    const s = String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [cols.join(',')];
  rows.forEach(r => lines.push(cols.map(c => escapeCell(r[c])).join(',')));
  const bom = '﻿';
  const blob = new Blob([bom + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function renderOverviewTable() {
  const wrap = document.getElementById('overviewTableWrap');
  if (!wrap) return;
  const all = cache.overview || [];
  const rows = overviewYearFilter
    ? all.filter(r => r.year === overviewYearFilter)
    : all.slice();

  // Sort
  const { key, dir } = overviewSort;
  rows.sort((a, b) => {
    let av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (key === 'last_activity') {
      av = new Date(av).getTime() || 0;
      bv = new Date(bv).getTime() || 0;
    }
    if (typeof av === 'string' && typeof bv === 'string') {
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = Number(av) || 0; bv = Number(bv) || 0;
    return dir === 'asc' ? av - bv : bv - av;
  });

  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty">沒有符合年級篩選的學生</div>';
    return;
  }

  const cols = [
    { key: 'display_name',   label: '姓名 Name' },
    { key: 'year',           label: '年級 Year' },
    { key: 'cohort_code',    label: '最近梯次 Cohort' },
    { key: 'total_attempts', label: '答題數 Attempts' },
    { key: 'accuracy_rate',  label: '正確率 Accuracy' },
    { key: 'sessions_count', label: 'Sessions' },
    { key: 'avg_time_per_q', label: '平均秒/題 Avg s/Q' },
    { key: 'last_activity',  label: '最近活動 Last seen' },
  ];

  wrap.innerHTML = `
    <table class="sortable clickable-rows">
      <thead><tr>
        ${cols.map(c => {
          const sortCls = overviewSort.key === c.key ? ('sorted-' + overviewSort.dir) : '';
          return `<th data-key="${c.key}" class="${sortCls}">${esc(c.label)}</th>`;
        }).join('')}
      </tr></thead>
      <tbody>
        ${rows.map(r => {
          const acc = toPct(r.accuracy_rate);
          const cls = accClass(acc);
          const avgT = (r.avg_time_per_q == null || isNaN(Number(r.avg_time_per_q)))
            ? '—' : Math.round(Number(r.avg_time_per_q)) + ' s';
          return `
            <tr data-student-id="${esc(r.student_id)}">
              <td>${esc(r.display_name || r.email || '?')}</td>
              <td>${esc(r.year || '—')}</td>
              <td>${esc(r.cohort_code || '—')}</td>
              <td>${(Number(r.total_attempts) || 0).toLocaleString()}</td>
              <td>
                <div class="acc-cell">
                  <div class="acc-bar-wrap"><div class="acc-bar-fill ${cls}" style="width:${acc}%"></div></div>
                  <div class="acc-text">${acc}%</div>
                </div>
              </td>
              <td>${Number(r.sessions_count) || 0}</td>
              <td>${avgT}</td>
              <td>${relativeTime(r.last_activity)}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  // Wire up sort headers
  wrap.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (overviewSort.key === k) {
        overviewSort.dir = overviewSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        overviewSort.key = k;
        overviewSort.dir = (k === 'display_name' || k === 'year' || k === 'cohort_code') ? 'asc' : 'desc';
      }
      renderOverviewTable();
    });
  });
  // Wire up row click → Tab 2
  wrap.querySelectorAll('tr[data-student-id]').forEach(tr => {
    tr.addEventListener('click', () => {
      switchTab('student', { studentId: tr.dataset.studentId });
    });
  });
}

async function fetchStudentTopicStats(studentId) {

async function fetchStudentRecentSessions(studentId) {
  if (cache.studentSessions[studentId]) return cache.studentSessions[studentId];
  const { data, error } = await supa
    .from('attempts')
    .select('session_id, is_correct, attempted_at, exam_sessions(name, phase, course)')
    .eq('student_id', studentId)
    .order('attempted_at', { ascending: false });
  if (error) throw error;

  // 依 session_id 聚合（query 已 desc 排序，每個 session 第一次出現的 row 即為該 session 最新時間）
  const groups = {};
  (data || []).forEach(a => {
    if (!groups[a.session_id]) {
      groups[a.session_id] = {
        session_id: a.session_id,
        name:   a.exam_sessions?.name   || '(unknown session)',
        phase:  a.exam_sessions?.phase  || 'practice',
        course: a.exam_sessions?.course || '',
        total: 0,
        correct: 0,
        last_attempted_at: a.attempted_at,
      };
    }
    const g = groups[a.session_id];
    g.total++;
    if (a.is_correct) g.correct++;
  });

  const sorted = Object.values(groups)
    .sort((a, b) => new Date(b.last_attempted_at) - new Date(a.last_attempted_at))
    .slice(0, 10);
  cache.studentSessions[studentId] = sorted;
  return sorted;
}

    wrap.innerHTML = '<div class="empty">找不到該學生</div>';
    return;
  }

  let topicStats, sessions;
  try {
    [topicStats, sessions] = await Promise.all([
      fetchStudentTopicStats(selectedStudentId),
      fetchStudentRecentSessions(selectedStudentId),
    ]);
  } catch (e) {
    wrap.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }
  if (!document.body.contains(wrap)) return; // stale: boot() rebuilt DOM mid-await

  // Layout: profile + radar (上排), sessions (下排)
  wrap.innerHTML = `
    <div class="grid-2">
      <div id="profileCardSlot"></div>
      <div id="radarChartSlot"></div>
    </div>
    <div id="recentSessionsSlot"></div>
  `;
  renderProfileCard(document.getElementById('profileCardSlot'), stu);
  renderRadarChart(document.getElementById('radarChartSlot'), stu, topicStats);
  renderRecentSessions(document.getElementById('recentSessionsSlot'), sessions);
}

function renderProfileCard(container, stu) {
  const nameForAvatar = (stu.display_name || stu.email || '?').trim();
  let initials = '?';
  if (nameForAvatar.includes('@')) {
    initials = nameForAvatar.split('@')[0].substring(0, 2).toUpperCase();
  } else {
    // 中文名取第一個字（display_name 第一個字）；英文取首字母
    const han = nameForAvatar.match(/[一-鿿]/g);
    if (han && han.length > 0) {
      initials = han[0];
    } else {
      const parts = nameForAvatar.split(/\s+/);
      initials = parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : nameForAvatar.substring(0, 2).toUpperCase();
    }
  }

  const acc = toPct(stu.accuracy_rate);
  const avgT = (stu.avg_time_per_q == null || isNaN(Number(stu.avg_time_per_q)))
    ? '—' : Math.round(Number(stu.avg_time_per_q)) + ' s';

  container.innerHTML = `
    <div class="profile-card card">
      <div class="profile-avatar">${esc(initials)}</div>
      <div class="profile-info">
        <div class="profile-name">${esc(stu.display_name || stu.email || '?')}</div>
        <div class="profile-meta">${esc(stu.year || '—')} · ${esc(stu.email || '')}</div>
      </div>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-label">總答題</div>
          <div class="profile-stat-value">${(Number(stu.total_attempts) || 0).toLocaleString()}</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-label">正確率</div>
          <div class="profile-stat-value">${acc}%</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-label">Sessions</div>
          <div class="profile-stat-value">${Number(stu.sessions_count) || 0}</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-label">Avg s/Q</div>
          <div class="profile-stat-value">${avgT}</div>
        </div>
      </div>
    </div>
  `;
}

function renderRadarChart(container, stu, topicStats) {
  // Aggregate topic_stats by major_topic
  const majors = {};
  (topicStats || []).forEach(t => {
    const m = t.major_topic || '其他';
    if (!majors[m]) majors[m] = { total: 0, correct: 0 };
    majors[m].total   += Number(t.total)   || 0;
    majors[m].correct += Number(t.correct) || 0;
  });
  const majorEntries = Object.entries(majors)
    .map(([m, v]) => ({
      major: m,
      total: v.total,
      correct: v.correct,
      accuracy: v.total > 0 ? +(v.correct / v.total * 100).toFixed(1) : 0,
    }))
    .sort((a, b) => a.major.localeCompare(b.major, 'zh-Hant'));

  destroyChart('studentMajorChart');

  if (majorEntries.length === 0) {
    container.innerHTML = `
      <div class="card">
        <div class="card-title">大科別表現 Major Topic Performance</div>
        <div class="empty">該學生尚無答題紀錄</div>
      </div>
    `;
    return;
  }

  const useRadar = majorEntries.length >= 3;
  container.innerHTML = `
    <div class="card">
      <div class="card-title">大科別表現 Major Topic Performance</div>
      <div class="card-sub">${useRadar ? `雷達圖 · ${majorEntries.length} 個大科` : '大科別少於 3 項，改用水平條形圖呈現'}</div>
      <div class="chart-wrap"><canvas id="studentMajorChart" height="${useRadar ? 220 : 140}"></canvas></div>
    </div>
  `;

  const canvas = document.getElementById('studentMajorChart');
  if (useRadar) {
    charts.studentMajorChart = new Chart(canvas, {
      type: 'radar',
      data: {
        labels: majorEntries.map(e => e.major),
        datasets: [{
          label: stu.display_name || stu.email || '正確率',
          data: majorEntries.map(e => e.accuracy),
          backgroundColor: 'rgba(176,141,79,0.2)',
          borderColor: '#b08d4f',
          pointBackgroundColor: '#b08d4f',
          pointBorderColor: '#fff',
          pointHoverBackgroundColor: '#fff',
          pointHoverBorderColor: '#b08d4f',
        }]
      },
      options: {
        responsive: true,
        scales: { r: { min: 0, max: 100, ticks: { stepSize: 25 } } },
        plugins: {
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const e = majorEntries[ctx.dataIndex];
                return `${e.accuracy}% (${e.correct}/${e.total})`;
              }
            }
          }
        }
      }
    });
  } else {
    charts.studentMajorChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: majorEntries.map(e => e.major),
        datasets: [{
          label: '正確率 (%)',
          data: majorEntries.map(e => e.accuracy),
          backgroundColor: majorEntries.map(e =>
            e.accuracy >= 70 ? '#4a7c59' : e.accuracy >= 50 ? '#b08d4f' : '#a3522e'
          ),
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        scales: { x: { min: 0, max: 100, title: { display: true, text: '%' } } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const e = majorEntries[ctx.dataIndex];
                return `${e.accuracy}% (${e.correct}/${e.total})`;
              }
            }
          }
        }
      }
    });
  }
}

// 點 session row 後拉出該學生在那一場 session 的所有 attempts，含題目本文（從 EXAM_BANK 對應）。
async function fetchSessionAttempts(studentId, sessionId) {
  const key = studentId + '_' + sessionId;
  if (cache.sessionAttempts[key]) return cache.sessionAttempts[key];
  const { data, error } = await supa
    .from('attempts')
    .select('question_id, category, selected_answer, correct_answer, is_correct, attempted_at, time_spent_sec')
    .eq('student_id', studentId)
    .eq('session_id', sessionId)
    .order('attempted_at', { ascending: true });
  if (error) throw error;
  cache.sessionAttempts[key] = data || [];
  return cache.sessionAttempts[key];
}

async function showSessionDetailModal(sessionId, sessionName, phase) {
  const studentId = selectedStudentId;
  const modal = document.getElementById('sessionDetailModal');
  const body  = document.getElementById('sessionDetailBody');
  body.innerHTML = '<div class="empty">載入答題明細中…</div>';
  modal.classList.add('active');

  let attempts;
  try {
    attempts = await fetchSessionAttempts(studentId, sessionId);
  } catch (e) {
    body.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }

  if (!attempts || attempts.length === 0) {
    body.innerHTML = '<div class="empty">這個 session 沒有答題紀錄</div>';
    return;
  }

  const stu = (cache.overview || []).find(s => s.student_id === studentId);
  const displayName = stu?.display_name || stu?.email || 'unknown';
  const total = attempts.length;
  const correct = attempts.filter(a => a.is_correct).length;
  const wrong = total - correct;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const phaseLabel = phase === 'pretest' ? '前測' : phase === 'posttest' ? '後測' : '練習';
  const firstAt = attempts[0]?.attempted_at;
  const dateStr = firstAt ? new Date(firstAt).toLocaleString('zh-Hant') : '—';

  // EXAM_BANK 由 ../exam-bank.js 載入（學生端共用）。若載入失敗則只顯示題號 + 答案對比。
  const bank = (window.EXAM_BANK && window.EXAM_BANK.questions) || [];
  const bankMap = {};
  bank.forEach(q => { bankMap[q.id] = q; });

  body.innerHTML = `
    <div class="session-detail-summary">
      <div><span class="session-detail-summary-label">學生</span><span class="session-detail-summary-value">${esc(displayName)}</span></div>
      <div><span class="session-detail-summary-label">場次</span><span class="session-detail-summary-value">${esc(sessionName)} · ${phaseLabel}</span></div>
      <div><span class="session-detail-summary-label">時間</span><span class="session-detail-summary-value">${esc(dateStr)}</span></div>
      <div><span class="session-detail-summary-label">分數</span><span class="session-detail-summary-value">${correct} / ${total} · ${pct}%</span></div>
      <div><span class="session-detail-summary-label">答錯</span><span class="session-detail-summary-value" style="color:var(--rust);">${wrong}</span></div>
    </div>
    <div>
      ${attempts.map(a => renderAttemptCard(a, bankMap[a.question_id])).join('')}
    </div>
  `;
}

function renderAttemptCard(a, q) {
  const isCorrect = !!a.is_correct;
  const cls = isCorrect ? 'correct' : 'wrong';
  const tag = isCorrect
    ? '<span class="attempt-tag correct">✓ 答對</span>'
    : '<span class="attempt-tag wrong">✗ 答錯</span>';
  const userAns    = a.selected_answer || '—';
  const correctAns = a.correct_answer  || '—';

  let questionHtml, userText, correctText;
  if (q) {
    questionHtml = `<div class="attempt-question">${esc(q.question || '')}</div>`;
    userText    = (userAns    !== '—' && q.options?.[userAns])    ? userAns    + ' · ' + q.options[userAns]    : userAns;
    correctText = (correctAns !== '—' && q.options?.[correctAns]) ? correctAns + ' · ' + q.options[correctAns] : correctAns;
  } else {
    questionHtml = '<div class="attempt-missing-bank">⚠ 題庫中找不到此題（可能已從題庫移除或更新）</div>';
    userText    = userAns;
    correctText = correctAns;
  }

  return `
    <div class="attempt-card ${cls}">
      <div class="attempt-meta">
        <code class="attempt-qid">${esc(a.question_id)}</code>
        <span>${esc(a.category || '—')}</span>
        ${a.time_spent_sec != null ? `<span>${Number(a.time_spent_sec)}s</span>` : ''}
        <span style="flex:1"></span>
        ${tag}
      </div>
      ${questionHtml}
      <div class="attempt-answers">
        <div class="attempt-answer-block ${isCorrect ? 'correct-ans' : 'user-wrong'}">
          <div class="attempt-answer-label">學生選</div>
          <div class="attempt-answer-text">${esc(userText)}</div>
        </div>
        <div class="attempt-answer-block correct-ans">
          <div class="attempt-answer-label">正解</div>
          <div class="attempt-answer-text">${esc(correctText)}</div>
        </div>
      </div>
    </div>`;
}

async function renderWrongTable() {
  const wrap = document.getElementById('wrongTableContent');
  if (!wrap) return;
  wrap.innerHTML = '<div class="empty">載入錯題中…</div>';

  let rows;
  try {
    rows = await fetchStudentWrongAttempts(selectedStudentId);
  } catch (e) {
    wrap.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }

  // 動態填入 exam 下拉（依該學生實際答錯過的所有 exam）
  const examFilter = document.getElementById('wrongExamFilter');
  const exams = [...new Set(rows.map(r => r.exam).filter(Boolean))].sort();
  if (!exams.includes(wrongFilters.exam)) wrongFilters.exam = '';
  examFilter.innerHTML =
    '<option value="">— 全部 —</option>' +
    exams.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
  examFilter.value = wrongFilters.exam;

  // 沒任何錯題：慶賀 placeholder
  if (!rows || rows.length === 0) {
    wrap.innerHTML = `
      <div class="card">
        <div class="empty-celebrate">太強了！這位學生目前沒有答錯過任何題目 🎉</div>
      </div>`;
    return;
  }

  // 套用三個篩選條件（AND）
  const q = wrongFilters.search.trim().toLowerCase();
  const filtered = rows.filter(r => {
    if (wrongFilters.major && categoryMajor(r.category) !== wrongFilters.major) return false;
    if (wrongFilters.exam && r.exam !== wrongFilters.exam) return false;
    if (q) {
      const qid = (r.question_id || '').toLowerCase();
      const cat = (r.category || '').toLowerCase();
      if (!qid.includes(q) && !cat.includes(q)) return false;
    }
    return true;
  });

  const stu = (cache.overview || []).find(s => s.student_id === selectedStudentId);
  const displayName = stu?.display_name || stu?.email || 'unknown';

  wrap.innerHTML = `
    <div class="stats-line">
      <span>共 <b>${rows.length}</b> 題錯誤 ｜ 套用篩選後顯示 <b>${filtered.length}</b> 題</span>
      <button class="btn btn-secondary" id="wrongExportBtn" ${filtered.length === 0 ? 'disabled' : ''}>📥 匯出 CSV</button>
    </div>
    ${filtered.length === 0
      ? '<div class="card"><div class="empty">目前篩選條件下沒有錯題</div></div>'
      : `<div class="card" style="padding:0;overflow:hidden;">
          <table>
            <thead><tr>
              <th>題號 Q-ID</th>
              <th>分類 Category</th>
              <th>你的答案</th>
              <th>正解</th>
              <th>試卷 Exam</th>
              <th>答錯時間</th>
            </tr></thead>
            <tbody>
              ${filtered.map(r => `
                <tr>
                  <td><code>${esc(r.question_id)}</code></td>
                  <td>${esc(r.category || '—')}</td>
                  <td><span class="diff-arrow diff-wrong">${esc(r.selected_answer || '-')}</span></td>
                  <td><span class="diff-arrow diff-correct">${esc(r.correct_answer || '-')}</span></td>
                  <td>${esc(r.exam || '—')}</td>
                  <td>${relativeTime(r.attempted_at)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`}
  `;

  const btn = document.getElementById('wrongExportBtn');
  if (btn && !btn.disabled) {
    btn.addEventListener('click', () => {
      const today = new Date().toISOString().substring(0, 10);
      const safe = displayName.replace(/[\\\/:*?"<>|]/g, '_');
      const csvRows = filtered.map(r => ({
        question_id:     r.question_id,
        category:        r.category,
        selected_answer: r.selected_answer,
        correct_answer:  r.correct_answer,
        exam:            r.exam,
        attempted_at:    r.attempted_at,
      }));
      exportCsv(csvRows, `${safe}_錯題_${today}.csv`);
    });
  }
}

async function renderWeakness() {
  const panel = document.getElementById('tab-weakness');
  panel.innerHTML = '<div class="empty">載入中…</div>';

  let students;
  try {
    students = await fetchOverview();
  } catch (e) {
    panel.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }
  if (!students || students.length === 0) {
    panel.innerHTML = '<div class="empty">尚無學生資料</div>';
    return;
  }
  if (weaknessMode === 'student') {
    if (!selectedStudentId || !students.find(s => s.student_id === selectedStudentId)) {
      selectedStudentId = students[0].student_id;
    }
  }

  // 班級模式才用得到梯次下拉。一次拉新 view → distinct cohort_code → 排序。
  // fail-open：v_class_topic_stats_by_cohort 還沒建（migration 沒跑）也要讓既有班級/個別視角能正常運作。
  let cohortOptions = [];
  if (weaknessMode === 'class') {
    try {
      const rows = await fetchClassTopicByCohort();
      cohortOptions = [...new Set((rows || []).map(r => r.cohort_code).filter(Boolean))].sort();
    } catch (e) {
      console.warn('[weakness] fetchClassTopicByCohort failed, cohort dropdown will be empty:', e);
    }
    // 若舊選的 cohort 不在新清單中（例：該梯尚無資料）→ 退回「全部」
    if (weaknessCohort && !cohortOptions.includes(weaknessCohort)) weaknessCohort = '';
  }
  if (!document.body.contains(panel)) return; // stale: boot() rebuilt DOM mid-await

  panel.innerHTML = `
    <div class="controls">
      <div class="ctrl-group">
        <label>視角 View</label>
        <div class="toggle-group">
          <button class="toggle-btn ${weaknessMode === 'class'   ? 'active' : ''}" data-mode="class">📚 班級</button>
          <button class="toggle-btn ${weaknessMode === 'student' ? 'active' : ''}" data-mode="student">👤 個別</button>
        </div>
      </div>
      <div class="ctrl-group" id="weaknessStudentGroup" style="${weaknessMode === 'class' ? 'display:none;' : ''}">
        <label>學生 Student</label>
        <select id="weaknessStudentPicker">
          ${students.map(s =>
            `<option value="${esc(s.student_id)}">${esc(s.display_name || s.email || '?')} (${esc(s.year || '?')})</option>`
          ).join('')}
        </select>
      </div>
      <div class="ctrl-group" id="weaknessCohortGroup" style="${weaknessMode === 'class' ? '' : 'display:none;'}">
        <label>梯次 Cohort</label>
        <select id="weaknessCohortPicker">
          <option value="">— 全部（含 practice）—</option>
          ${cohortOptions.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="ctrl-group">
        <label>排序 Sort</label>
        <button class="btn btn-secondary" id="weaknessSortBtn">${weaknessSortAsc ? '📉 最弱在頂' : '📈 最強在頂'}</button>
      </div>
      <div class="ctrl-group">
        <label>大科別 Major（可多選）</label>
        <div class="chip-group" id="weaknessMajorChips">
          <button class="chip ${weaknessMajorFilter.has('婦科') ? 'active' : ''}" data-major="婦科">婦科</button>
          <button class="chip ${weaknessMajorFilter.has('產科') ? 'active' : ''}" data-major="產科">產科</button>
          <button class="chip ${weaknessMajorFilter.has('其他') ? 'active' : ''}" data-major="其他">其他</button>
        </div>
      </div>
    </div>
    <div id="weaknessContent"></div>
  `;

  panel.querySelectorAll('.toggle-btn[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (weaknessMode === btn.dataset.mode) return;
      weaknessMode = btn.dataset.mode;
      renderWeakness(); // 全 re-render（picker 顯隱要切換）
    });
  });
  if (weaknessMode === 'student') {
    const picker = document.getElementById('weaknessStudentPicker');
    picker.value = selectedStudentId;
    picker.addEventListener('change', e => {
      selectedStudentId = e.target.value;
      renderWeaknessChart();
    });
  }
  if (weaknessMode === 'class') {
    const cohortPicker = document.getElementById('weaknessCohortPicker');
    cohortPicker.value = weaknessCohort;
    cohortPicker.addEventListener('change', e => {
      weaknessCohort = e.target.value;
      renderWeaknessChart();
    });
  }
  document.getElementById('weaknessSortBtn').addEventListener('click', e => {
    weaknessSortAsc = !weaknessSortAsc;
    e.currentTarget.textContent = weaknessSortAsc ? '📉 最弱在頂' : '📈 最強在頂';
    renderWeaknessChart();
  });
  panel.querySelectorAll('.chip[data-major]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.major;
      if (weaknessMajorFilter.has(m)) weaknessMajorFilter.delete(m);
      else weaknessMajorFilter.add(m);
      btn.classList.toggle('active');
      renderWeaknessChart();
    });
  });

  await renderWeaknessChart();
}

async function renderWeaknessChart() {
  const wrap = document.getElementById('weaknessContent');
  if (!wrap) return;
  wrap.innerHTML = '<div class="empty">載入中…</div>';

  let rawRows;
  try {
    if (weaknessMode === 'class') {
      if (weaknessCohort) {
        // 選了梯次 → 用 v1.9 cohort view，前端 filter cohort_code
        const all = await fetchClassTopicByCohort();
        rawRows = (all || []).filter(r => r.cohort_code === weaknessCohort);
      } else {
        // 「全部」→ 沿用既有 v_class_topic_stats（全班全時間，含 practice）
        rawRows = await fetchClassTopicStats();
      }
    } else {
      const raw = await fetchStudentTopicStats(selectedStudentId);
      rawRows = (raw || []).map(r => ({
        major_topic: r.major_topic,
        sub_topic:   r.sub_topic,
        total:       Number(r.total) || 0,
        correct:     Number(r.correct) || 0,
        accuracy:    toPct(r.accuracy_rate),
      }));
    }
  } catch (e) {
    destroyChart('weaknessChart');
    wrap.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }

  if (!rawRows || rawRows.length === 0) {
    destroyChart('weaknessChart');
    const emptyMsg = weaknessMode === 'student'
      ? '該學生尚無答題紀錄'
      : weaknessCohort
        ? `梯次 ${esc(weaknessCohort)} 尚無 topic 統計資料（可能未做過 pretest/posttest，或 attempts 沒有 category）`
        : '尚無班級資料';
    wrap.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  // Major filter（用 categoryMajor 把婦癌等歸到「其他」）
  const filtered = rawRows.filter(r => weaknessMajorFilter.has(categoryMajor(r.major_topic)));
  // Sort
  filtered.sort((a, b) => weaknessSortAsc ? a.accuracy - b.accuracy : b.accuracy - a.accuracy);

  if (filtered.length === 0) {
    destroyChart('weaknessChart');
    wrap.innerHTML = '<div class="card"><div class="empty">沒有符合大科別篩選的子主題（請打開更多 chip）</div></div>';
    return;
  }

  // 動態高度（每列 ~26px，最少 240px）
  const chartH = Math.max(filtered.length * 26 + 60, 240);

  const stu = (cache.overview || []).find(s => s.student_id === selectedStudentId);
  const subTitle = weaknessMode === 'class'
    ? (weaknessCohort
        ? `班級視角 · 梯次 ${esc(weaknessCohort)} · ${filtered.length} 個子主題`
        : `班級視角 · 全部（含 practice）· ${filtered.length} 個子主題`)
    : `${esc(stu?.display_name || stu?.email || '?')} · ${filtered.length} 個子主題`;
  const sortLabel = weaknessSortAsc ? '正確率升序（最弱在頂）' : '正確率降序（最強在頂）';

  wrap.innerHTML = `
    <div class="card">
      <div class="card-title">${weaknessMode === 'class' ? '班級弱項分布 Class Weakness' : '個人弱項分布 Personal Weakness'}</div>
      <div class="card-sub">${subTitle} · ${sortLabel}</div>
      <div class="chart-wrap" style="height:${chartH}px; position:relative;">
        <canvas id="weaknessChart"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-title">子主題清單 Sub-topic List</div>
      <div class="card-sub">同上圖資料；顏色依正確率閾值（&lt;50% 紅、50–70% 黃、≥70% 綠）</div>
      <div class="weakness-chips">
        ${filtered.map(r => `
          <div class="weak-chip ${accClass(r.accuracy)}">
            <span class="weak-chip-name">${esc(r.sub_topic || '?')}</span>
            <span class="weak-chip-acc">${r.accuracy.toFixed(1)}%</span>
            <span class="weak-chip-counts">(${r.correct}/${r.total})</span>
          </div>`).join('')}
      </div>
    </div>
  `;
  if (!document.body.contains(wrap)) return; // stale: boot() rebuilt DOM mid-await

  destroyChart('weaknessChart');
  charts.weaknessChart = new Chart(document.getElementById('weaknessChart'), {
    type: 'bar',
    data: {
      labels: filtered.map(r => r.sub_topic),
      datasets: [{
        label: '正確率 (%)',
        data: filtered.map(r => r.accuracy),
        backgroundColor: filtered.map(r =>
          r.accuracy >= 70 ? '#4a7c59' : r.accuracy >= 50 ? '#b08d4f' : '#a3522e'
        ),
        borderWidth: 0,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { min: 0, max: 100, title: { display: true, text: '正確率 %' } },
        y: { ticks: { autoSkip: false } },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const r = filtered[ctx.dataIndex];
              return `${r.accuracy.toFixed(1)}% (${r.correct}/${r.total})`;
            }
          }
        }
      }
    }
  });
}

async function fetchMisconceptionHotspots() {
  if (cache.hotspots) return cache.hotspots;
  const { data, error } = await supa.from('v_misconception_hotspots').select('*');
  if (error) throw error;
  cache.hotspots = data || [];

}

// 簡易 toast
function showToast(msg) {
  let toast = document.getElementById('globalToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'globalToast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // fallback for non-secure contexts
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
  }
  showToast(`已複製 ${text}`);
}

// 把 question_id 變成合法的 HTML id 後綴
function safeId(s) {
  return String(s || '').replace(/[^a-zA-Z0-9-]/g, '_');
}

  panel.innerHTML = '<div class="empty">載入中…</div>';

  } catch (e) {

      <div class="mc-intro">
        <b>📌 誘答熱點 (Misconception Hotspots)：</b>班級正確率 &lt; 70% 的題目，依「最多錯誤集中於同一錯誤選項」排序。集中度愈高，代表觀念誤解愈一致，建議全班討論。

  // 動態 exam 選項（從 13 rows 拉）
  const exams = [...new Set(rows.map(r => r.exam).filter(Boolean))].sort();

  panel.innerHTML = `
    <div class="mc-intro">
      <b>📌 誘答熱點 (Misconception Hotspots)：</b>班級正確率 &lt; 70% 的題目，依「最多錯誤集中於同一錯誤選項」排序。集中度愈高，代表觀念誤解愈一致，建議全班討論。

      <div class="ctrl-group">

          <button class="chip ${misconceptionFilters.majors.has('其他') ? 'active' : ''}" data-major="其他">其他</button>
        </div>
      </div>
      <div class="ctrl-group">
        <label>試卷 Exam</label>
        <select id="mcExamFilter">
          <option value="">— 全部 —</option>
          ${exams.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('')}
        </select>
      </div>
      <div class="ctrl-group">
        <label>最少答題數：<b id="mcMinLabel">${misconceptionFilters.minAttempts}</b> 人</label>
        <input type="range" id="mcMinSlider" min="1" max="7" step="1" value="${misconceptionFilters.minAttempts}" style="min-width:180px;"/>
      </div>
      <div class="ctrl-group">
        <label>排序 Sort</label>
        <select id="mcSortBy">
          <option value="distractor_concentration">誘答集中度（高→低）</option>
          <option value="class_accuracy">班級正確率（低→高）</option>
          <option value="total_attempts">答題人數（多→少）</option>
        </select>
      </div>
    </div>

    <div id="mcGrid"></div>
  `;

  document.getElementById('mcExamFilter').value = misconceptionFilters.exam;

  panel.querySelectorAll('.chip[data-major]').forEach(btn => {

      else misconceptionFilters.majors.add(m);
      btn.classList.toggle('active');
      renderMisconceptionGrid();
    });

  document.getElementById('mcExamFilter').addEventListener('change', e => {
    misconceptionFilters.exam = e.target.value;
    renderMisconceptionGrid();
  });
  document.getElementById('mcMinSlider').addEventListener('input', e => {

function renderMisconceptionGrid() {
  const grid = document.getElementById('mcGrid');
  if (!grid) return;

  // 每次重畫前 destroy 所有 mc-chart-* 圖表
  Object.keys(charts).forEach(id => {
    if (id.startsWith('mc-chart-')) destroyChart(id);
  });

  const rows = cache.hotspots || [];
  const filtered = rows.filter(r => {
    if (!misconceptionFilters.majors.has(categoryMajor(r.category))) return false;
    if (misconceptionFilters.exam && r.exam !== misconceptionFilters.exam) return false;
    if ((Number(r.total_attempts) || 0) < misconceptionFilters.minAttempts) return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (misconceptionSortBy === 'class_accuracy') {
      return toPct(a.class_accuracy) - toPct(b.class_accuracy);   // ASC
    }
    if (misconceptionSortBy === 'total_attempts') {
      return (Number(b.total_attempts) || 0) - (Number(a.total_attempts) || 0); // DESC
    }
    // distractor_concentration DESC（預設）
    return toPct(b.distractor_concentration) - toPct(a.distractor_concentration);
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="card"><div class="empty">目前篩選條件下沒有誘答熱點 🎯 — 試著放寬條件</div></div>`;
    return;
  }

  grid.innerHTML = `
    <div class="stats-line">
      <span>共 <b>${rows.length}</b> 個熱點 ｜ 套用篩選後顯示 <b>${filtered.length}</b> 個</span>
    </div>
    <div class="misconception-grid">
      ${filtered.map(r => {
        const acc  = toPct(r.class_accuracy);
        const conc = toPct(r.distractor_concentration);
        const isSystemic = conc >= 60 && acc < 50;
        const sid = safeId(r.question_id);
        const correct = String(r.correct_answer || '').toUpperCase();
        const topD    = String(r.top_distractor  || '').toUpperCase();
        return `
          <div class="mc-card">
            ${isSystemic ? '<div class="mc-warning-badge">⚠️ 系統性觀念錯誤</div>' : ''}
            <div class="mc-card-header">
              <span class="mc-qid" data-qid="${esc(r.question_id)}" title="點擊複製題號">${esc(r.question_id)}</span>
              <span class="mc-tags">
                <span class="mc-tag-cat">${esc(r.category || '—')}</span>
                <span>·</span>
                <span>${esc(r.exam || '—')}</span>
              </span>
            </div>
            <div class="mc-acc-row">
              <div class="mc-acc-block">
                <div class="mc-acc-label">班級正確率</div>
                <div class="mc-acc-value ${accClass(acc)}">${acc}%</div>
              </div>
              <div class="mc-acc-meta">
                正解 <b>${esc(correct || '?')}</b>
                ${topD
                  ? ` · 最常誤選 <b style="color:var(--red);">${esc(topD)}</b>（集中度 ${conc}%）`
                  : ' · <span class="mc-no-distractor">無明顯誘答集中</span>'}
                <br>${Number(r.total_attempts) || 0} 人作答 · ${Number(r.correct_count) || 0} 答對
              </div>
            </div>
            <div class="mc-chart-wrap">
              <canvas id="mc-chart-${sid}"></canvas>
            </div>
          </div>`;
      }).join('')}
    </div>
  `;

  // 點題號複製
  grid.querySelectorAll('.mc-qid').forEach(el => {
    el.addEventListener('click', () => copyToClipboard(el.dataset.qid));
  });

  // 每張卡的 chart
  filtered.forEach(r => {
    const sid = safeId(r.question_id);
    const chartId = `mc-chart-${sid}`;
    const canvas = document.getElementById(chartId);
    if (!canvas) return;

    const labels = ['A', 'B', 'C', 'D', 'E'];
    const data = [
      Number(r.chose_a) || 0,
      Number(r.chose_b) || 0,
      Number(r.chose_c) || 0,
      Number(r.chose_d) || 0,
      Number(r.chose_e) || 0,
    ];
    const correct = String(r.correct_answer || '').toUpperCase();
    const topD    = String(r.top_distractor  || '').toUpperCase();
    const colors = labels.map(L =>
      L === correct ? '#4a7c59' :
      (topD && L === topD) ? '#c0463a' :
      '#d8d3c5'
    );

    charts[chartId] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '人數',
          data,
          backgroundColor: colors,
          borderWidth: 0,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            beginAtZero: true,
            ticks: { stepSize: 1, precision: 0 },
            title: { display: true, text: '選擇人數' },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const L = labels[ctx.dataIndex];
                const tag = L === correct ? '（正解）' : (topD && L === topD) ? '（最常誤選）' : '';
                return `${data[ctx.dataIndex]} 人 ${tag}`;
              }
            }
          }
        }
      }
    });
  });
}

  // Wire controls
  document.getElementById('rotationSearchInput').addEventListener('input', e => {
    rotationSearch = e.target.value.trim();
    renderRotationList();
  });
  document.getElementById('rotationReload').addEventListener('click', async () => {
    cache.rotationOverview = null;
    cache.rotationPair = {};
    cache.rotationTopic = {};
    selectedRotationKey = null;
    await renderRotationTab();
  });

  // Initial fetch + render
  try {
    await fetchRotationOverview();
  } catch (e) {
    document.getElementById('rotationListWrap').innerHTML =
      `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }
  renderRotationList();
  // 之前已選的梯次 — 重新進 Tab 時自動展開
  if (selectedRotationKey) await renderRotationDetail(selectedRotationKey);
}

function renderRotationList() {
  const wrap = document.getElementById('rotationListWrap');
  if (!wrap) return;
  const all = cache.rotationOverview || [];
  // 過濾：搜尋字串對 cohort_code / rotation_title_display / rotation_key 模糊比對
  const q = rotationSearch.toLowerCase();
  let rows = q
    ? all.filter(r =>
        String(r.cohort_code || '').toLowerCase().includes(q) ||
        String(r.rotation_title_display || '').toLowerCase().includes(q) ||
        String(r.rotation_key || '').toLowerCase().includes(q)
      )
    : all.slice();

  // Sort
  const { key, dir } = rotationListSort;
  rows.sort((a, b) => {
    let av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (key === 'first_attempt_at' || key === 'last_attempt_at') {
      av = new Date(av).getTime() || 0;
      bv = new Date(bv).getTime() || 0;
    }
    if (typeof av === 'string' && typeof bv === 'string') {
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = Number(av) || 0; bv = Number(bv) || 0;
    return dir === 'asc' ? av - bv : bv - av;
  });

  if (rows.length === 0) {
    wrap.innerHTML = all.length === 0
      ? '<div class="empty">尚無 rotation 資料 — 等學生跑過 rotation 模式 quiz 才會出現。</div>'
      : '<div class="empty">沒有符合搜尋條件的梯次。</div>';
    return;
  }

  const cols = [
    { key: 'cohort_code',            label: '梯次 Cohort' },
    { key: 'rotation_title_display', label: '原始名稱 Title' },
    { key: 'student_count',          label: '學員 Students' },
    { key: 'pretest_session_count',  label: '前測場次 Pre' },
    { key: 'posttest_session_count', label: '後測場次 Post' },
    { key: 'total_attempts',         label: '答題數 Attempts' },
    { key: 'overall_accuracy',       label: '整體正確率 Acc' },
    { key: 'avg_time_spent_sec',     label: '平均秒/題 Avg s/Q' },
    { key: 'last_attempt_at',        label: '最近答題 Last' },
  ];

  wrap.innerHTML = `
    <table class="sortable clickable-rows">
      <thead><tr>
        ${cols.map(c => {
          const sortCls = rotationListSort.key === c.key ? ('sorted-' + rotationListSort.dir) : '';
          return `<th data-key="${c.key}" class="${sortCls}">${esc(c.label)}</th>`;
        }).join('')}
      </tr></thead>
      <tbody>
        ${rows.map(r => {
          const acc = toPct(r.overall_accuracy);
          const accCls = accClass(acc);
          const avgT = (r.avg_time_spent_sec == null || isNaN(Number(r.avg_time_spent_sec)))
            ? '—' : Math.round(Number(r.avg_time_spent_sec)) + ' s';
          const selectedCls = selectedRotationKey === r.rotation_key ? 'row-selected' : '';
          return `
            <tr data-rotation-key="${esc(r.rotation_key)}" class="${selectedCls}">
              <td><b>${esc(r.cohort_code || '—')}</b></td>
              <td>${esc(r.rotation_title_display || '—')}</td>
              <td>${Number(r.student_count) || 0}</td>
              <td>${Number(r.pretest_session_count) || 0}</td>
              <td>${Number(r.posttest_session_count) || 0}</td>
              <td>${(Number(r.total_attempts) || 0).toLocaleString()}</td>
              <td>
                <div class="acc-cell">
                  <div class="acc-bar-wrap"><div class="acc-bar-fill ${accCls}" style="width:${acc}%"></div></div>
                  <div class="acc-text">${acc}%</div>
                </div>
              </td>
              <td>${avgT}</td>
              <td>${relativeTime(r.last_attempt_at)}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  // Sort 標題點擊
  wrap.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (rotationListSort.key === k) {
        rotationListSort.dir = rotationListSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        rotationListSort.key = k;
        rotationListSort.dir = (k === 'cohort_code' || k === 'rotation_title_display') ? 'asc' : 'desc';
      }
      renderRotationList();
    });
  });
  // 點 row → 展開細節
  wrap.querySelectorAll('tr[data-rotation-key]').forEach(tr => {
    tr.addEventListener('click', async () => {
      selectedRotationKey = tr.dataset.rotationKey;
      renderRotationList();    // 重新渲染讓 row-selected 樣式更新
      await renderRotationDetail(selectedRotationKey);
      // 視覺反饋：自動滾到 detail 區
      const detail = document.getElementById('rotationDetailWrap');
      if (detail) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

async function renderRotationDetail(rotationKey) {
  const wrap = document.getElementById('rotationDetailWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="card"><div class="empty">載入中…</div></div>';

  let pairRows, topicRows;
  try {
    [pairRows, topicRows] = await Promise.all([
      fetchRotationPair(rotationKey),
      fetchRotationTopic(rotationKey),
    ]);
  } catch (e) {
    wrap.innerHTML = `<div class="card"><div class="empty">載入失敗：${esc(e.message || String(e))}</div></div>`;
    return;
  }

  const cohortInfo = (cache.rotationOverview || []).find(r => r.rotation_key === rotationKey) || {};
  const title = `${esc(cohortInfo.cohort_code || cohortInfo.rotation_key || '?')}（${esc(cohortInfo.rotation_title_display || '—')}）`;

  wrap.innerHTML = `
    <div class="card">
      <div class="card-title">📊 ${title} · 學員前後測對比</div>
      <div class="card-sub">同學生 pretest → posttest 的進步幅度。delta = posttest − pretest（百分點）</div>
      <div id="rotationPairTableWrap">${renderPairTableHTML(pairRows)}</div>
      <div style="height:300px;margin-top:16px;"><canvas id="rotationPairChart"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">🎯 ${title} · 主題弱項</div>
      <div class="card-sub">每個主題分類在 pretest / posttest 的正確率對比</div>
      <div id="rotationTopicTableWrap">${renderTopicTableHTML(topicRows)}</div>
    </div>
  `;

  // 畫 chart
  renderRotationPairChart(pairRows);
}

function renderPairTableHTML(rows) {
  if (!rows || rows.length === 0) {
    return '<div class="empty">此梯次尚無學員前後測資料。</div>';
  }
  // 排序：has_both 優先、其次按 delta_accuracy 降冪
  const sorted = rows.slice().sort((a, b) => {
    if (a.has_both !== b.has_both) return a.has_both ? -1 : 1;
    return (Number(b.delta_accuracy) || -999) - (Number(a.delta_accuracy) || -999);
  });
  return `
    <table>
      <thead><tr>
        <th>學生</th>
        <th>Pre 答題</th>
        <th>Pre 正確率</th>
        <th>Post 答題</th>
        <th>Post 正確率</th>
        <th>Δ 進步</th>
      </tr></thead>
      <tbody>
        ${sorted.map(r => {
          const preAcc  = r.pretest_accuracy  == null ? '—' : Number(r.pretest_accuracy).toFixed(1) + '%';
          const postAcc = r.posttest_accuracy == null ? '—' : Number(r.posttest_accuracy).toFixed(1) + '%';
          const delta   = r.delta_accuracy    == null ? '—' :
            (Number(r.delta_accuracy) >= 0 ? '+' : '') + Number(r.delta_accuracy).toFixed(1) + '%';
          const deltaCls = r.delta_accuracy == null ? '' :
            (Number(r.delta_accuracy) >= 10 ? 'acc-high' :
             Number(r.delta_accuracy) >= 0  ? 'acc-mid'  : 'acc-low');
          return `<tr>
            <td><b>${esc(r.student_name || r.student_email || '?')}</b></td>
            <td>${Number(r.pretest_attempts)  || 0}</td>
            <td>${preAcc}</td>
            <td>${Number(r.posttest_attempts) || 0}</td>
            <td>${postAcc}</td>
            <td class="${deltaCls}"><b>${delta}</b></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function renderTopicTableHTML(rows) {
  if (!rows || rows.length === 0) {
    return '<div class="empty">此梯次尚無主題分類統計（attempts 的 category 都是 NULL？）。</div>';
  }
  // group by category，pivot pre/post 兩欄
  const map = {};
  rows.forEach(r => {
    if (!map[r.category]) map[r.category] = { pre: null, post: null };
    if (r.phase === 'pretest')  map[r.category].pre  = r;
    if (r.phase === 'posttest') map[r.category].post = r;
  });
  // 依 pretest accuracy 由低到高排（最弱在頂）
  const sortedCats = Object.keys(map).sort((a, b) => {
    const aAcc = map[a].pre?.accuracy_pct ?? 999;
    const bAcc = map[b].pre?.accuracy_pct ?? 999;
    return aAcc - bAcc;
  });
  return `
    <table>
      <thead><tr>
        <th>主題 Category</th>
        <th>Pre 答題</th>
        <th>Pre 正確率</th>
        <th>Post 答題</th>
        <th>Post 正確率</th>
        <th>Δ 進步</th>
      </tr></thead>
      <tbody>
        ${sortedCats.map(cat => {
          const p = map[cat].pre, q = map[cat].post;
          const preAcc  = p ? Number(p.accuracy_pct).toFixed(1) + '%' : '—';
          const postAcc = q ? Number(q.accuracy_pct).toFixed(1) + '%' : '—';
          let delta = '—', deltaCls = '';
          if (p && q) {
            const d = Number(q.accuracy_pct) - Number(p.accuracy_pct);
            delta = (d >= 0 ? '+' : '') + d.toFixed(1) + '%';
            deltaCls = d >= 10 ? 'acc-high' : d >= 0 ? 'acc-mid' : 'acc-low';
          }
          return `<tr>
            <td>${esc(cat)}</td>
            <td>${p ? Number(p.attempts_count) : 0}</td>
            <td>${preAcc}</td>
            <td>${q ? Number(q.attempts_count) : 0}</td>
            <td>${postAcc}</td>
            <td class="${deltaCls}"><b>${delta}</b></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function renderRotationPairChart(rows) {
  destroyChart('rotationPairChart');
  if (!rows || rows.length === 0) return;
  const canvas = document.getElementById('rotationPairChart');
  if (!canvas) return;

  // 只畫有任一測量的學生
  const filtered = rows.filter(r => r.pretest_attempts > 0 || r.posttest_attempts > 0);
  if (filtered.length === 0) return;

  // X 軸學生姓名
  const labels = filtered.map(r => r.student_name || r.student_email || '?');
  const preData  = filtered.map(r => r.pretest_accuracy  == null ? null : Number(r.pretest_accuracy));
  const postData = filtered.map(r => r.posttest_accuracy == null ? null : Number(r.posttest_accuracy));

  charts.rotationPairChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Pretest 正確率 (%)',  data: preData,  backgroundColor: 'rgba(99, 132, 255, 0.7)' },
        { label: 'Posttest 正確率 (%)', data: postData, backgroundColor: 'rgba(46, 204, 113, 0.7)' },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } },
      },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          callbacks: {
            label: (ctx) => ctx.dataset.label + '：' + (ctx.parsed.y == null ? '—' : ctx.parsed.y.toFixed(1) + '%'),
          }
        }
      }
    }
  });
}

window.addEventListener('DOMContentLoaded', boot);
supa.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') boot();
  if (event === 'SIGNED_OUT') showLogin();
});
</script>
