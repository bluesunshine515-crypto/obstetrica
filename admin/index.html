<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obstetrica · 老師後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --ink: #1a1d1f;
  --ink-soft: #4a5258;
  --ink-mute: #8b939a;
  --paper: #faf8f3;
  --card: #ffffff;
  --line: #e6e0d4;
  --gold: #b08d4f;
  --rust: #a3522e;
  --teal: #2e6e7a;
  --green: #4a7c59;
  --red: #c0463a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Serif TC', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
}
header {
  background: var(--ink);
  color: var(--paper);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.brand { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 20px; }
.brand-sub { font-size: 13px; opacity: 0.7; margin-left: 8px; font-weight: 400; }
.user-area { font-size: 14px; display: flex; gap: 12px; align-items: center; }
.user-area a, .user-area button {
  color: var(--paper); background: none; border: 1px solid rgba(250,248,243,0.3);
  padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
  text-decoration: none;
}
.user-area button:hover, .user-area a:hover { background: rgba(250,248,243,0.1); }
main { max-width: 1280px; margin: 0 auto; padding: 24px; }
.controls {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: end;
  background: var(--card); padding: 16px; border-radius: 8px;
  border: 1px solid var(--line); margin-bottom: 20px;
}
.ctrl-group { display: flex; flex-direction: column; gap: 4px; }
.ctrl-group label { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.ctrl-group select, .ctrl-group input {
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px;
  font: inherit; background: white; min-width: 180px;
}
.btn {
  padding: 8px 16px; background: var(--ink); color: var(--paper);
  border: none; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 500;
}
.btn:hover { background: #2a2d2f; }
.btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px;
}
.kpi-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-size: 32px; font-weight: 600; margin-top: 4px; font-family: 'Noto Serif TC', serif; }
.kpi-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-2 > * { min-width: 0; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 20px; margin-bottom: 20px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; font-family: 'Noto Serif TC', serif; }
.card-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
.chart-wrap { position: relative; }
.chart-wrap canvas { max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--ink-soft); font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; background: #fafafa; }
tbody tr:hover { background: #fafafa; }
.tag-pre { color: var(--teal); font-size: 12px; font-weight: 500; }
.tag-post { color: var(--gold); font-size: 12px; font-weight: 500; }
.tag-practice { color: var(--ink-mute); font-size: 12px; font-weight: 500; }
.tag-correct { color: var(--green); font-weight: 600; }
.tag-wrong { color: var(--red); font-weight: 600; }
.empty {
  text-align: center; padding: 40px; color: var(--ink-mute);
  font-style: italic;
}
/* modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-bg.active { display: flex; }
.modal-box {
  background: var(--card); border-radius: 8px; padding: 28px; width: 90%; max-width: 420px;
}
.modal-box h2 { font-family: 'Noto Serif TC', serif; margin-bottom: 8px; }
.modal-box p { color: var(--ink-soft); font-size: 14px; margin-bottom: 16px; }
.modal-box input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 4px; font: inherit; margin-bottom: 12px;
}
.modal-box button { width: 100%; padding: 12px; background: var(--ink); color: var(--paper); border: none; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 500; }
.status-msg { font-size: 13px; color: var(--ink-soft); margin-top: 12px; line-height: 1.5; }
.deny-card { text-align: center; padding: 60px 20px; }
.deny-card h2 { font-family: 'Noto Serif TC', serif; margin-bottom: 12px; }
.deny-card p { color: var(--ink-soft); margin-bottom: 16px; }

/* ===== Tabs (v1.7) ===== */
.tab-bar {
  display: flex; gap: 4px; margin-bottom: 20px;
  border-bottom: 2px solid var(--line);
  overflow-x: auto;
  scrollbar-width: thin;
}
.tab-btn {
  padding: 12px 18px; background: none; border: none;
  font: inherit; font-size: 14px; cursor: pointer;
  color: var(--ink-soft); white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  display: inline-flex; align-items: baseline; gap: 6px;
}
.tab-btn:hover { color: var(--ink); background: rgba(0,0,0,0.02); }
.tab-btn.active {
  color: var(--ink); border-bottom-color: var(--gold); font-weight: 600;
}
.tab-btn .en { font-size: 11px; color: var(--ink-mute); font-weight: 400; }
.tab-btn.active .en { color: var(--gold); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== Accuracy bar ===== */
.acc-cell { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.acc-bar-wrap { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
.acc-bar-fill { height: 100%; transition: width 0.3s; }
.acc-bar-fill.low  { background: var(--red); }
.acc-bar-fill.mid  { background: var(--gold); }
.acc-bar-fill.high { background: var(--green); }
.acc-text { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 48px; text-align: right; color: var(--ink); }

/* ===== Sortable table ===== */
table.sortable th { cursor: pointer; user-select: none; }
table.sortable th:hover { background: #f0ede5; }
table.sortable th.sorted-asc::after  { content: ' ↑'; color: var(--gold); }
table.sortable th.sorted-desc::after { content: ' ↓'; color: var(--gold); }
table.clickable-rows tbody tr { cursor: pointer; }
table.clickable-rows tbody tr:hover { background: #f5f0e2; }

/* ===== Tab placeholder (for tabs not yet implemented) ===== */
.tab-stub { padding: 80px 20px; text-align: center; color: var(--ink-mute); font-style: italic; font-size: 15px; }

/* ===== Tab 2: Student profile card ===== */
.profile-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
}
.profile-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--rust));
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 600; font-family: 'Noto Serif TC', serif;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.profile-info { min-width: 0; }
.profile-name { font-size: 22px; font-weight: 600; font-family: 'Noto Serif TC', serif; }
.profile-meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; word-break: break-all; }
.profile-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.profile-stat { text-align: right; min-width: 64px; }
.profile-stat-label { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.5px; }
.profile-stat-value { font-size: 22px; font-weight: 600; font-family: 'Noto Serif TC', serif; margin-top: 2px; font-variant-numeric: tabular-nums; }
.profile-stat-value.small { font-size: 14px; }
@media (max-width: 760px) {
  .profile-card { grid-template-columns: auto 1fr; }
  .profile-stats { grid-column: 1 / -1; justify-content: flex-start; gap: 18px; }
  .profile-stat { text-align: left; }
}
</style>
</head>
<body>

<header>
  <div>
    <span class="brand">Obstetrica</span>
    <span class="brand-sub">老師後台 · TSGH OB/GYN Residency</span>
  </div>
  <div class="user-area" id="userArea"></div>
</header>

<main id="mainContent">
  <div class="empty" id="loadingMsg">載入中…</div>
</main>

<!-- Login modal -->
<div class="modal-bg" id="loginModal">
  <div class="modal-box">
    <h2>老師登入</h2>
    <p>輸入老師 email，我們會寄一封 Magic Link 給你。</p>
    <input type="email" id="loginEmail" placeholder="老師 email" autocomplete="email"/>
    <button onclick="doLogin()">寄送登入連結</button>
    <div class="status-msg" id="loginStatus"></div>
  </div>
</div>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://faeqleeuisevhuqveilx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aCZ6yh9Mi_jX0l4E8gHSqQ_wAMHYfaj';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
const REDIRECT_TO = window.location.origin + window.location.pathname;

// ===== 8-axis category grouping (legacy: kept for Tab 4/5 future use) =====
const CATEGORY_GROUPS = {
  '婦科-生殖內分泌/不孕': ['婦科-生殖內分泌','婦科-不孕症','婦科-青春期/異常出血'],
  '婦科-良性腫瘤/異常':   ['婦科-子宮肌瘤','婦科-子宮內膜異位','婦科-卵巢腫瘤','婦科-性發育異常','婦科-生殖道發育'],
  '婦科-手術/感染/泌尿': ['婦科-微創手術','婦科-手術解剖','婦科-骨盆腔發炎','婦科-感染','婦科-泌尿婦科'],
  '婦癌':                 ['婦癌-子宮頸癌','婦癌-子宮頸癌前病變','婦癌-子宮內膜癌','婦癌-卵巢癌','婦癌-生殖細胞瘤'],
  '產科-產前/胎兒':       ['產科-產前檢查','產科-產前保健','產科-胎兒生理','產科-遺傳學','產科-妊娠生理變化','產科-胎盤生理'],
  '產科-妊娠併發症':       ['產科-妊娠糖尿病','產科-高血壓疾病','產科-妊娠感染','產科-妊娠合併症','產科-早期破水','產科-過期妊娠','產科-子宮外孕','產科-流產','產科-人工流產'],
  '產科-產時/分娩':       ['產科-剖腹產','產科-胎位','產科-產科解剖','產科-產科感染'],
  '產科-產後':            ['產科-產後感染','產科-產後哺乳','產科-會陰裂傷'],
};
const CAT_TO_GROUP = {};
for (const [g, cats] of Object.entries(CATEGORY_GROUPS)) cats.forEach(c => CAT_TO_GROUP[c] = g);
function groupOf(cat) {
  if (!cat) return '其他';
  if (CAT_TO_GROUP[cat]) return CAT_TO_GROUP[cat];
  if (cat.startsWith('婦癌')) return '婦癌';
  if (cat.startsWith('婦科')) return '婦科-良性腫瘤/異常';
  if (cat.startsWith('產科')) return '產科-妊娠併發症';
  return '其他';
}
const GROUP_ORDER = Object.keys(CATEGORY_GROUPS);

// ===== STATE =====
let me = null; // current logged-in teacher row
let activeTab = 'overview';
let selectedStudentId = null; // 跨 tab 共享
const cache = {
  overview: null,        // v_student_overview
  classTopic: null,      // v_class_topic_stats
  hotspots: null,        // v_misconception_hotspots
  questionStats: null,   // v_question_stats
  studentTopic: {},      // keyed by studentId → v_student_topic_stats rows
  studentWrong: {},      // keyed by studentId → wrong attempts rows
  studentSessions: {},   // keyed by studentId → grouped session rows
};
const charts = {};
// Tab 1 state
let overviewSort = { key: 'last_activity', dir: 'desc' };
let overviewYearFilter = '';

// ===== UTILITIES =====
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}
function relativeTime(iso) {
  if (!iso) return '—';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '—';
  const diff = Date.now() - t;
  if (diff < 0) return '剛剛';
  if (diff < 60_000) return '剛剛';
  if (diff < 3_600_000) return Math.floor(diff / 60_000) + ' 分鐘前';
  if (diff < 86_400_000) return Math.floor(diff / 3_600_000) + ' 小時前';
  if (diff < 30 * 86_400_000) return Math.floor(diff / 86_400_000) + ' 天前';
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Normalize accuracy to a 0–100 number (handles both 0–1 ratio and 0–100 percent forms)
function toPct(v) {
  if (v == null) return 0;
  const n = Number(v);
  if (isNaN(n)) return 0;
  return n > 1 ? +n.toFixed(1) : +(n * 100).toFixed(1);
}
function accClass(pct) {
  return pct >= 70 ? 'high' : pct >= 50 ? 'mid' : 'low';
}

// ===== AUTH =====
function showLogin() {
  document.getElementById('loginModal').classList.add('active');
  document.getElementById('mainContent').innerHTML = '';
  document.getElementById('userArea').innerHTML = '';
}
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const status = document.getElementById('loginStatus');
  if (!email || !email.includes('@')) { alert('請輸入 email'); return; }
  status.textContent = '寄送中…';
  const { error } = await supa.auth.signInWithOtp({
    email, options: { emailRedirectTo: REDIRECT_TO }
  });
  if (error) { status.textContent = '寄送失敗：' + error.message; return; }
  status.innerHTML = '✉️ 已寄出！請到 <b>' + esc(email) + '</b> 收信，點開連結即可登入。';
}
async function logout() {
  await supa.auth.signOut();
  location.reload();
}
function showDenied(reason) {
  document.getElementById('mainContent').innerHTML = `
    <div class="deny-card card">
      <h2>無權限存取</h2>
      <p>${esc(reason)}</p>
      <button class="btn" onclick="logout()">登出並切換帳號</button>
    </div>`;
}

// ===== BOOT =====
async function boot() {
  const { data: { session } } = await supa.auth.getSession();
  if (!session) { showLogin(); return; }
  const { data: row, error } = await supa.from('students').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !row) {
    showDenied('找不到使用者資料：' + (error?.message ?? '請先到主站完成首次登入'));
    return;
  }
  if (row.role !== 'teacher') {
    showDenied('此頁面僅限老師。你目前的身份是「學員」。');
    return;
  }
  me = row;
  document.getElementById('userArea').innerHTML = `
    <span>👨‍🏫 ${esc(me.name || me.email)}</span>
    <a href="../">學員端</a>
    <button onclick="logout()">登出</button>`;
  document.getElementById('loginModal').classList.remove('active');
  renderShell();
  switchTab('overview');
}

// ===== SHELL =====
function renderShell() {
  document.getElementById('mainContent').innerHTML = `
    <nav class="tab-bar" role="tablist">
      <button class="tab-btn" data-tab="overview">📊 班級總覽 <span class="en">Overview</span></button>
      <button class="tab-btn" data-tab="student">👤 學生詳情 <span class="en">Student</span></button>
      <button class="tab-btn" data-tab="wrong">❌ 錯題集 <span class="en">Wrong</span></button>
      <button class="tab-btn" data-tab="weakness">🎯 弱項分析 <span class="en">Weakness</span></button>
      <button class="tab-btn" data-tab="misconception">🔍 誘答分析 <span class="en">Misconception</span></button>
    </nav>
    <div class="tab-panel" id="tab-overview"></div>
    <div class="tab-panel" id="tab-student"><div class="tab-stub">敬請期待 · Tab 2 將實作學生詳情</div></div>
    <div class="tab-panel" id="tab-wrong"><div class="tab-stub">敬請期待 · Tab 3 將實作錯題集</div></div>
    <div class="tab-panel" id="tab-weakness"><div class="tab-stub">敬請期待 · Tab 4 將實作弱項分析</div></div>
    <div class="tab-panel" id="tab-misconception"><div class="tab-stub">敬請期待 · Tab 5 將實作誘答分析</div></div>
  `;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
}

function switchTab(name, opts = {}) {
  activeTab = name;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'tab-' + name);
  });
  if (opts.studentId) selectedStudentId = opts.studentId;

  if (name === 'overview') renderOverview();
  else if (name === 'student') renderStudentDetail();
  // Tab 3-5 will be wired up in subsequent iterations.
}

// ===== TAB 1: OVERVIEW =====
async function fetchOverview() {
  if (cache.overview) return cache.overview;
  const { data, error } = await supa
    .from('v_student_overview')
    .select('*');
  if (error) throw error;
  cache.overview = data || [];
  return cache.overview;
}

async function renderOverview() {
  const panel = document.getElementById('tab-overview');
  panel.innerHTML = '<div class="empty">載入中…</div>';
  let rows;
  try {
    rows = await fetchOverview();
  } catch (e) {
    panel.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }
  if (!rows || rows.length === 0) {
    panel.innerHTML = '<div class="empty">尚無學生資料</div>';
    return;
  }

  // KPIs
  const totalStudents = rows.length;
  const totalAttempts = rows.reduce((s, r) => s + (Number(r.total_attempts) || 0), 0);
  const totalCorrect  = rows.reduce((s, r) => s + (Number(r.correct_count) || 0), 0);
  const classAcc = totalAttempts > 0 ? +(totalCorrect / totalAttempts * 100).toFixed(1) : 0;
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const activeWeek = rows.filter(r => {
    if (!r.last_activity) return false;
    const t = new Date(r.last_activity).getTime();
    return !isNaN(t) && t >= sevenDaysAgo;
  }).length;

  panel.innerHTML = `
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">學生總數</div>
        <div class="kpi-value">${totalStudents}</div>
        <div class="kpi-sub">Total students</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">累計答題數</div>
        <div class="kpi-value">${totalAttempts.toLocaleString()}</div>
        <div class="kpi-sub">Total attempts</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">班級平均正確率</div>
        <div class="kpi-value">${classAcc}%</div>
        <div class="kpi-sub">${totalCorrect.toLocaleString()} 答對</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">本週活躍人數</div>
        <div class="kpi-value">${activeWeek}</div>
        <div class="kpi-sub">近 7 天 active</div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <label>年級 Year</label>
        <select id="overviewYearFilter">
          <option value="">— 全部 —</option>
          <option value="R1">R1</option>
          <option value="R2">R2</option>
          <option value="R3">R3</option>
          <option value="R4">R4</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="overviewReload">🔄 重新載入</button>
    </div>

    <div class="card">
      <div class="card-title">學生列表 Student List</div>
      <div class="card-sub">點擊任一列可跳到「學生詳情」分頁；點欄位標題可切換排序</div>
      <div id="overviewTableWrap"></div>
    </div>
  `;

  const yearSel = document.getElementById('overviewYearFilter');
  yearSel.value = overviewYearFilter;
  yearSel.addEventListener('change', e => {
    overviewYearFilter = e.target.value;
    renderOverviewTable();
  });
  document.getElementById('overviewReload').addEventListener('click', async () => {
    cache.overview = null;
    await renderOverview();
  });

  renderOverviewTable();
}

function renderOverviewTable() {
  const wrap = document.getElementById('overviewTableWrap');
  if (!wrap) return;
  const all = cache.overview || [];
  const rows = overviewYearFilter
    ? all.filter(r => r.year === overviewYearFilter)
    : all.slice();

  // Sort
  const { key, dir } = overviewSort;
  rows.sort((a, b) => {
    let av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (key === 'last_activity') {
      av = new Date(av).getTime() || 0;
      bv = new Date(bv).getTime() || 0;
    }
    if (typeof av === 'string' && typeof bv === 'string') {
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = Number(av) || 0; bv = Number(bv) || 0;
    return dir === 'asc' ? av - bv : bv - av;
  });

  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty">沒有符合年級篩選的學生</div>';
    return;
  }

  const cols = [
    { key: 'display_name',   label: '姓名 Name' },
    { key: 'year',           label: '年級 Year' },
    { key: 'total_attempts', label: '答題數 Attempts' },
    { key: 'accuracy_rate',  label: '正確率 Accuracy' },
    { key: 'sessions_count', label: 'Sessions' },
    { key: 'avg_time_per_q', label: '平均秒/題 Avg s/Q' },
    { key: 'last_activity',  label: '最近活動 Last seen' },
  ];

  wrap.innerHTML = `
    <table class="sortable clickable-rows">
      <thead><tr>
        ${cols.map(c => {
          const sortCls = overviewSort.key === c.key ? ('sorted-' + overviewSort.dir) : '';
          return `<th data-key="${c.key}" class="${sortCls}">${esc(c.label)}</th>`;
        }).join('')}
      </tr></thead>
      <tbody>
        ${rows.map(r => {
          const acc = toPct(r.accuracy_rate);
          const cls = accClass(acc);
          const avgT = (r.avg_time_per_q == null || isNaN(Number(r.avg_time_per_q)))
            ? '—' : Math.round(Number(r.avg_time_per_q)) + ' s';
          return `
            <tr data-student-id="${esc(r.student_id)}">
              <td>${esc(r.display_name || r.email || '?')}</td>
              <td>${esc(r.year || '—')}</td>
              <td>${(Number(r.total_attempts) || 0).toLocaleString()}</td>
              <td>
                <div class="acc-cell">
                  <div class="acc-bar-wrap"><div class="acc-bar-fill ${cls}" style="width:${acc}%"></div></div>
                  <div class="acc-text">${acc}%</div>
                </div>
              </td>
              <td>${Number(r.sessions_count) || 0}</td>
              <td>${avgT}</td>
              <td>${relativeTime(r.last_activity)}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  // Wire up sort headers
  wrap.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (overviewSort.key === k) {
        overviewSort.dir = overviewSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        overviewSort.key = k;
        overviewSort.dir = (k === 'display_name' || k === 'year') ? 'asc' : 'desc';
      }
      renderOverviewTable();
    });
  });
  // Wire up row click → Tab 2
  wrap.querySelectorAll('tr[data-student-id]').forEach(tr => {
    tr.addEventListener('click', () => {
      switchTab('student', { studentId: tr.dataset.studentId });
    });
  });
}

// ===== TAB 2: STUDENT DETAIL =====
async function fetchStudentTopicStats(studentId) {
  if (cache.studentTopic[studentId]) return cache.studentTopic[studentId];
  const { data, error } = await supa
    .from('v_student_topic_stats')
    .select('*')
    .eq('student_id', studentId);
  if (error) throw error;
  cache.studentTopic[studentId] = data || [];
  return cache.studentTopic[studentId];
}

async function fetchStudentRecentSessions(studentId) {
  if (cache.studentSessions[studentId]) return cache.studentSessions[studentId];
  const { data, error } = await supa
    .from('attempts')
    .select('session_id, is_correct, attempted_at, exam_sessions(name, phase, course)')
    .eq('student_id', studentId)
    .order('attempted_at', { ascending: false });
  if (error) throw error;

  // 依 session_id 聚合（query 已 desc 排序，每個 session 第一次出現的 row 即為該 session 最新時間）
  const groups = {};
  (data || []).forEach(a => {
    if (!groups[a.session_id]) {
      groups[a.session_id] = {
        session_id: a.session_id,
        name:   a.exam_sessions?.name   || '(unknown session)',
        phase:  a.exam_sessions?.phase  || 'practice',
        course: a.exam_sessions?.course || '',
        total: 0,
        correct: 0,
        last_attempted_at: a.attempted_at,
      };
    }
    const g = groups[a.session_id];
    g.total++;
    if (a.is_correct) g.correct++;
  });

  const sorted = Object.values(groups)
    .sort((a, b) => new Date(b.last_attempted_at) - new Date(a.last_attempted_at))
    .slice(0, 10);
  cache.studentSessions[studentId] = sorted;
  return sorted;
}

async function renderStudentDetail() {
  const panel = document.getElementById('tab-student');
  panel.innerHTML = '<div class="empty">載入學生清單中…</div>';

  let students;
  try {
    students = await fetchOverview();
  } catch (e) {
    panel.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }
  if (!students || students.length === 0) {
    panel.innerHTML = '<div class="empty">尚無學生資料</div>';
    return;
  }

  // 預設選擇：跨 tab 帶入的 selectedStudentId，否則第一筆
  if (!selectedStudentId || !students.find(s => s.student_id === selectedStudentId)) {
    selectedStudentId = students[0].student_id;
  }

  panel.innerHTML = `
    <div class="controls">
      <div class="ctrl-group">
        <label>選擇學生 Student</label>
        <select id="studentPicker">
          ${students.map(s =>
            `<option value="${esc(s.student_id)}">${esc(s.display_name || s.email || '?')} (${esc(s.year || '?')})</option>`
          ).join('')}
        </select>
      </div>
    </div>
    <div id="studentDetailContent"></div>
  `;
  const picker = document.getElementById('studentPicker');
  picker.value = selectedStudentId;
  picker.addEventListener('change', e => {
    selectedStudentId = e.target.value;
    renderStudentDetailContent();
  });
  renderStudentDetailContent();
}

async function renderStudentDetailContent() {
  const wrap = document.getElementById('studentDetailContent');
  if (!wrap) return;
  wrap.innerHTML = '<div class="empty">載入中…</div>';

  // 不重打 v_student_overview — 從 Tab 1 的 cache 取
  const stu = (cache.overview || []).find(s => s.student_id === selectedStudentId);
  if (!stu) {
    wrap.innerHTML = '<div class="empty">找不到該學生</div>';
    return;
  }

  let topicStats, sessions;
  try {
    [topicStats, sessions] = await Promise.all([
      fetchStudentTopicStats(selectedStudentId),
      fetchStudentRecentSessions(selectedStudentId),
    ]);
  } catch (e) {
    wrap.innerHTML = `<div class="empty">載入失敗：${esc(e.message || String(e))}</div>`;
    return;
  }

  // Layout: profile + radar (上排), sessions (下排)
  wrap.innerHTML = `
    <div class="grid-2">
      <div id="profileCardSlot"></div>
      <div id="radarChartSlot"></div>
    </div>
    <div id="recentSessionsSlot"></div>
  `;
  renderProfileCard(document.getElementById('profileCardSlot'), stu);
  renderRadarChart(document.getElementById('radarChartSlot'), stu, topicStats);
  renderRecentSessions(document.getElementById('recentSessionsSlot'), sessions);
}

function renderProfileCard(container, stu) {
  const nameForAvatar = (stu.display_name || stu.email || '?').trim();
  let initials = '?';
  if (nameForAvatar.includes('@')) {
    initials = nameForAvatar.split('@')[0].substring(0, 2).toUpperCase();
  } else {
    // 中文名取第一個字（display_name 第一個字）；英文取首字母
    const han = nameForAvatar.match(/[一-鿿]/g);
    if (han && han.length > 0) {
      initials = han[0];
    } else {
      const parts = nameForAvatar.split(/\s+/);
      initials = parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : nameForAvatar.substring(0, 2).toUpperCase();
    }
  }

  const acc = toPct(stu.accuracy_rate);
  const avgT = (stu.avg_time_per_q == null || isNaN(Number(stu.avg_time_per_q)))
    ? '—' : Math.round(Number(stu.avg_time_per_q)) + ' s';

  container.innerHTML = `
    <div class="profile-card card">
      <div class="profile-avatar">${esc(initials)}</div>
      <div class="profile-info">
        <div class="profile-name">${esc(stu.display_name || stu.email || '?')}</div>
        <div class="profile-meta">${esc(stu.year || '—')} · ${esc(stu.email || '')}</div>
      </div>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-label">總答題</div>
          <div class="profile-stat-value">${(Number(stu.total_attempts) || 0).toLocaleString()}</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-label">正確率</div>
          <div class="profile-stat-value">${acc}%</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-label">Sessions</div>
          <div class="profile-stat-value">${Number(stu.sessions_count) || 0}</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-label">Avg s/Q</div>
          <div class="profile-stat-value">${avgT}</div>
        </div>
      </div>
    </div>
  `;
}

function renderRadarChart(container, stu, topicStats) {
  // Aggregate topic_stats by major_topic
  const majors = {};
  (topicStats || []).forEach(t => {
    const m = t.major_topic || '其他';
    if (!majors[m]) majors[m] = { total: 0, correct: 0 };
    majors[m].total   += Number(t.total)   || 0;
    majors[m].correct += Number(t.correct) || 0;
  });
  const majorEntries = Object.entries(majors)
    .map(([m, v]) => ({
      major: m,
      total: v.total,
      correct: v.correct,
      accuracy: v.total > 0 ? +(v.correct / v.total * 100).toFixed(1) : 0,
    }))
    .sort((a, b) => a.major.localeCompare(b.major, 'zh-Hant'));

  destroyChart('studentMajorChart');

  if (majorEntries.length === 0) {
    container.innerHTML = `
      <div class="card">
        <div class="card-title">大科別表現 Major Topic Performance</div>
        <div class="empty">該學生尚無答題紀錄</div>
      </div>
    `;
    return;
  }

  const useRadar = majorEntries.length >= 3;
  container.innerHTML = `
    <div class="card">
      <div class="card-title">大科別表現 Major Topic Performance</div>
      <div class="card-sub">${useRadar ? `雷達圖 · ${majorEntries.length} 個大科` : '大科別少於 3 項，改用水平條形圖呈現'}</div>
      <div class="chart-wrap"><canvas id="studentMajorChart" height="${useRadar ? 220 : 140}"></canvas></div>
    </div>
  `;

  const canvas = document.getElementById('studentMajorChart');
  if (useRadar) {
    charts.studentMajorChart = new Chart(canvas, {
      type: 'radar',
      data: {
        labels: majorEntries.map(e => e.major),
        datasets: [{
          label: stu.display_name || stu.email || '正確率',
          data: majorEntries.map(e => e.accuracy),
          backgroundColor: 'rgba(176,141,79,0.2)',
          borderColor: '#b08d4f',
          pointBackgroundColor: '#b08d4f',
          pointBorderColor: '#fff',
          pointHoverBackgroundColor: '#fff',
          pointHoverBorderColor: '#b08d4f',
        }]
      },
      options: {
        responsive: true,
        scales: { r: { min: 0, max: 100, ticks: { stepSize: 25 } } },
        plugins: {
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const e = majorEntries[ctx.dataIndex];
                return `${e.accuracy}% (${e.correct}/${e.total})`;
              }
            }
          }
        }
      }
    });
  } else {
    charts.studentMajorChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: majorEntries.map(e => e.major),
        datasets: [{
          label: '正確率 (%)',
          data: majorEntries.map(e => e.accuracy),
          backgroundColor: majorEntries.map(e =>
            e.accuracy >= 70 ? '#4a7c59' : e.accuracy >= 50 ? '#b08d4f' : '#a3522e'
          ),
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        scales: { x: { min: 0, max: 100, title: { display: true, text: '%' } } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const e = majorEntries[ctx.dataIndex];
                return `${e.accuracy}% (${e.correct}/${e.total})`;
              }
            }
          }
        }
      }
    });
  }
}

function renderRecentSessions(container, sessions) {
  if (!sessions || sessions.length === 0) {
    container.innerHTML = `
      <div class="card">
        <div class="card-title">最近 10 次 Sessions</div>
        <div class="empty">尚無 session 紀錄</div>
      </div>
    `;
    return;
  }
  container.innerHTML = `
    <div class="card">
      <div class="card-title">最近 10 次 Sessions</div>
      <div class="card-sub">依最後一次作答時間排序</div>
      <table>
        <thead><tr>
          <th>Session</th>
          <th>Phase</th>
          <th>Course</th>
          <th>答題數</th>
          <th>正確率</th>
          <th>最後作答</th>
        </tr></thead>
        <tbody>
          ${sessions.map(s => {
            const a = s.total > 0 ? +(s.correct / s.total * 100).toFixed(1) : 0;
            const cls = accClass(a);
            const phaseTag =
              s.phase === 'pretest'  ? 'tag-pre'
              : s.phase === 'posttest' ? 'tag-post'
              : 'tag-practice';
            return `
              <tr>
                <td>${esc(s.name)}</td>
                <td><span class="${phaseTag}">${esc(s.phase || 'practice')}</span></td>
                <td>${esc(s.course || '—')}</td>
                <td>${s.total}</td>
                <td>
                  <div class="acc-cell">
                    <div class="acc-bar-wrap"><div class="acc-bar-fill ${cls}" style="width:${a}%"></div></div>
                    <div class="acc-text">${a}%</div>
                  </div>
                </td>
                <td>${relativeTime(s.last_attempted_at)}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') boot();
  if (event === 'SIGNED_OUT') showLogin();
});
